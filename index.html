<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>St Eanswythe's Parents Evening</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 50px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 800px;
            width: 100%;
        }
        img {
            max-width: 200px;
            height: auto;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        #timer {
            font-size: 8em;
            font-weight: bold;
            color: #d9534f;
            margin: 30px 0;
            font-variant-numeric: tabular-nums;
        }
        button {
            padding: 15px 40px;
            font-size: 1.5em;
            background-color: #0275d8;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #025aa5;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo referenced verbatim[cite: 1] -->
        <img src="logo (1).png" alt="St Eanswythe's Logo">
        
        <h1>St Eanswythe's Parents Evening November 19</h1>
        
        <div id="timer">10:00</div>
        
        <!-- Button required to bypass browser autoplay restrictions -->
        <button id="startBtn">Start Timer</button>
    </div>

    <!-- Audio element for the bell sound[cite: 2] -->
    <audio id="bellSound" src="bell.wav" preload="auto"></audio>

    <script>
        const TIMER_DURATION = 600; // 10 minutes in seconds
        let timeLeft = TIMER_DURATION;
        let timerInterval;
        let isRunning = false;

        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');
        const bellSound = document.getElementById('bellSound');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function playBell(times) {
            let count = 0;
            
            bellSound.onended = function() {
                count++;
                if (count < times) {
                    bellSound.currentTime = 0;
                    bellSound.play();
                }
            };
            
            bellSound.currentTime = 0;
            bellSound.play().catch(e => console.error("Audio playback failed:", e));
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            
            // Hide the start button once running
            startBtn.style.display = 'none';

            timerInterval = setInterval(() => {
                timeLeft--;
                updateDisplay();

                if (timeLeft <= 0) {
                    playBell(3);
                    timeLeft = TIMER_DURATION; // Reset the timer immediately
                    updateDisplay();
                }
            }, 1000);
        }

        startBtn.addEventListener('click', startTimer);
        
        // Initialize the display on load
        updateDisplay();
    </script>
</body>
</html>
