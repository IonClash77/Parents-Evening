<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>St Eanswythes Parents Evening</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 50px;
            background-color: #3b0303; 
            color: #ffffff;
        }
        .container {
            background: #5c0a0a; 
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            display: inline-block;
            max-width: 90%;
            width: 1200px;
        }
        img {
            max-width: 220px;
            height: auto;
            margin-bottom: 20px;
            background-color: white; 
            border-radius: 50%;
            padding: 10px;
        }
        h1 {
            font-size: 3.5em;
            margin-bottom: 5px; /* Tightened space between H1 and H2 */
        }
        h2 {
            font-size: 2.2em; /* Slightly smaller than H1 */
            margin-top: 0;
            margin-bottom: 40px;
            color: #ffcccc;
            font-weight: normal;
        }
        .appointment-label {
            font-size: 2.5em;
            margin-top: 40px; /* Small space before the label */
            margin-bottom: -15px; /* Pull it tight to the timer */
        }
        #timer {
            font-size: 16em; 
            font-weight: bold;
            color: #ffcccc; 
            margin: 0 0 20px 0;
            font-variant-numeric: tabular-nums;
            text-shadow: 4px 4px 15px rgba(0,0,0,0.4);
        }
        button {
            padding: 20px 50px;
            font-size: 2em;
            background-color: #8f1212;
            color: white;
            border: 2px solid #ffcccc;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #b51717;
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="St Eanswythes Logo">
        
        <h1>St Eanswythes Parents Evening</h1>
        <h2>November 19</h2>
        
        <div class="appointment-label">Appointment time:</div>
        <div id="timer">10:00</div>
        
        <button id="startBtn">Start Timer</button>
    </div>

    <!-- Audio element for the bell sound -->
    <audio id="bellSound" src="bell.wav" preload="auto"></audio>

    <script>
        const TIMER_DURATION = 600; // 10 minutes in seconds
        let timeLeft = TIMER_DURATION;
        let timerInterval;
        let isRunning = false;

        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');
        const bellSound = document.getElementById('bellSound');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function playBell(times) {
            let count = 0;
            
            bellSound.onended = function() {
                count++;
                if (count < times) {
                    bellSound.currentTime = 0;
                    bellSound.play();
                }
            };
            
            bellSound.currentTime = 0;
            bellSound.play().catch(e => console.error("Audio playback failed:", e));
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            
            // Hide the start button once running
            startBtn.style.display = 'none';

            timerInterval = setInterval(() => {
                timeLeft--;
                updateDisplay();

                if (timeLeft <= 0) {
                    playBell(3);
                    timeLeft = TIMER_DURATION; // Reset the timer immediately
                    updateDisplay();
                }
            }, 1000);
        }

        startBtn.addEventListener('click', startTimer);
        
        // Initialize the display on load
        updateDisplay();
    </script>
</body>
</html>
